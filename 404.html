<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Redirect all 404 routes to index.html and preserve path/query for Blazor WASM routing on GitHub Pages
        var repoName = '/PublicOsintWebApp';
        var redirectTo = repoName + '/index.html' + location.search + location.hash;
        var path = location.pathname.startsWith(repoName) ? location.pathname.replace(repoName, '') : location.pathname;
        if (path && path !== '/index.html' && path !== '/') {
            redirectTo += '?path=' + encodeURIComponent(path);
        }
        window.location.replace(redirectTo);
    </script>
</head>
<body>
</body>
</html>
